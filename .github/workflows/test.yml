name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npm test

  react:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest
          cache: npm
          cache-dependency-path: react/package-lock.json
      - run: npm ci
        working-directory: react
      - run: npm run build
        working-directory: react
